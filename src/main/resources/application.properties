spring.application.name=Asset-Tracking-System

# Own schema, not db_ems. The TMS backend points at db_ems because that is the shared
# employee master; AMS owns its asset tables, so it gets db_asset on the same server.
spring.datasource.url=jdbc:mysql://192.168.100.30:3309/db_asset?rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=Pass@123

# none, NOT update. EmpDetailsMaster maps db_all_master.emp_details, a shared table other
# applications depend on; with ddl-auto=update Hibernate would happily ALTER it to match
# this project's mapping. AMS tables are created by hand instead (see ams_login_access).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# Responses compressed (gzip) when the browser accepts it: the device / register lists are
# large JSON and shrink by ~80-90% on the wire, so they arrive much faster. Small answers
# (under 1KB) are sent as they are.
server.compression.enabled=true
server.compression.mime-types=application/json,text/plain,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# Root that FileStorageService writes under; its folder constants hang off this.
file.upload.base-path=/upload

# Spring's own multipart cap defaults to 1MB, which rejects the request before
# FileStorageService.validateUploadFile ever runs. Raised past the 50MB the service allows.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# LOCAL DEVELOPMENT ONLY. false = sign in with any password, or none at all; only the
# emp_code and the ams_login_access row are checked.
#
# emp_pass lives in db_all_master, which every application here reads, so putting a known
# test password in it would change real credentials for everyone. Not comparing is the
# safer way to sign in locally.
#
# LoginServiceImpl logs a WARN on every sign-in while this is false. SET IT TO true (or
# delete the line - it defaults to true) BEFORE THIS RUNS ANYWHERE BUT A DEV MACHINE.
login.password.verify=false

# reg_by = the signed-in employee on every new row (RegByListener, for all entities)
spring.jpa.mapping-resources=META-INF/orm.xml
